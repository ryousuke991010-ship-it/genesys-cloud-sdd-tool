<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Genesys SDD Studio</title>
  <meta name="referrer" content="no-referrer">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">◆</span>
        <div>
          <div class="brand-name">SDD Studio</div>
          <div class="brand-sub">for Genesys Cloud</div>
        </div>
      </div>
      <button type="button" class="btn btn-new" id="newProjectBtn">＋ 新しい業務プロジェクト</button>
      <nav class="nav" id="nav" aria-label="プロジェクト"></nav>
      <div class="sidebar-foot">
        <button type="button" class="nav-link" id="settingsBtn">⚙ 設定(AI・接続・データ)</button>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="breadcrumb" id="pageTitle">ホーム</div>
        <div class="topbar-right">
          <span class="pill" id="aiPill" title="接続済みのAI">AI: 未設定</span>
          <span class="pill" id="gcPill" title="Genesys Cloudの接続状態">Genesys: 未接続</span>
          <button type="button" class="btn btn-small" id="gcConnectBtn">Genesys Cloudに接続</button>
        </div>
      </header>
      <main class="content" id="content" tabindex="-1"></main>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
